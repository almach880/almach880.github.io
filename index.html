<html lang="en">
<head>

<!-- Bump ?v= whenever site.css or engine.js changes. GitHub Pages caches
     assets for ~10 minutes and browsers cache them harder than HTML, so
     without this a visitor can get new markup with the old stylesheet. -->
<link rel="stylesheet" href="assets/site.css?v=2" />
</head>
<body>

<div id="app">

  <aside class="rail">
    <div class="mark"><span class="pulse"></span>painted live · 4 loops · analytic springs</div>

    <div class="head-row">
      <h1 id="ident-name">Neal<br />Meinke</h1>
      <p class="role" id="ident-role"></p>
    </div>

    <div class="detail" id="detail">
      <div class="kicker" id="d-kicker"></div>
      <h2 id="d-title"></h2>
      <div class="scroll" id="d-scroll">
        <p class="body" id="d-body"></p>
        <div class="rule"></div>
        <div class="long" id="d-long"></div>
        <div class="golinks" id="d-links"></div>
        <div class="foot-note" id="d-foot"></div>
      </div>
      <div class="chips" id="d-chips"></div>
    </div>

    <div class="rail-foot">
      <div class="links">
        <a href="notes/">Notes</a>
        <a href="https://www.linkedin.com/in/nealmeinke/">LinkedIn</a>
        <a href="https://github.com/nealm682">GitHub</a>
      </div>
    </div>
  </aside>

  <div class="split" id="split" role="separator" aria-orientation="vertical"
       aria-label="Resize reading column" tabindex="0"
       title="Drag to resize · double-click to reset"></div>

  <main class="stage">
    <canvas id="c"></canvas>

    <div class="hud">
      <div><b id="h-fps">—</b> fps</div>
      <div><b id="h-springs">0</b> springs live</div>
      <div class="state" id="h-state">painting</div>
    </div>

    <div class="controls">
      <div class="seg" role="group" aria-label="Motion scheme">
        <button id="b-exp" aria-pressed="true">Expressive</button>
        <button id="b-std" aria-pressed="false">Standard</button>
      </div>
      <div class="seg" role="group" aria-label="Ambient motion">
        <button id="b-live" aria-pressed="true">Live</button>
        <button id="b-still" aria-pressed="false">Still</button>
      </div>
      <div class="seg">
        <button id="b-repaint" aria-pressed="false">Repaint</button>
      </div>
    </div>

    <div class="hint">click to open · drag a node and let go · empty space steps out</div>
  </main>

</div>

<!-- ============================================================
     CONTENT REGISTRY
     Every file in content/ calls NM.add([...]) or NM.setIdentity({...}).
     Plain <script> tags rather than fetch(), so the site also works when
     opened directly from disk with file:// — no server required to preview.
     To add a branch: drop a new file in content/ and add one line here.
     ============================================================ -->
<script>
  window.NM = {
    identity: null,
    nodes: [],
    add: function (list) { this.nodes = this.nodes.concat(list); return this; },
    setIdentity: function (o) { this.identity = o; return this; }
  };
</script>

</body>
